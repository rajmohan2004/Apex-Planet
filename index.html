<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Styling & JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Responsive Quiz & API Data</h1>

  <!-- Interactive Quiz -->
  <div class="quiz">
    <h2>Quiz: What is the capital of France?</h2>
    <button onclick="checkAnswer('a')">A. Berlin</button>
    <button onclick="checkAnswer('b')">B. Madrid</button>
    <button onclick="checkAnswer('c')">C. Paris</button>
    <p id="quiz-result"></p>
  </div>

  <!-- API Data Fetch -->
  <div class="api-section">
    <h2>Random Joke Generator</h2>
    <button onclick="getJoke()">Get a Joke</button>
    <p id="joke"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
